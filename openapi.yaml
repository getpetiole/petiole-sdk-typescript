      type: object
      required:
        - object
        - data
        - hasMore
      title: WorkflowList
      description: The workflows the API key may use.
  securitySchemes:
    apiKey:
      type: http
      description: "An API key, `ptl_live_` and then the secret on production, `ptl_test_` on staging, sent as `Authorization: Bearer <key>`. Keep it on a server: it is shown once, when it is made. A revoked or expired key gets `401`."
      scheme: bearer
      bearerFormat: ptl_live_… or ptl_test_…
    user:
      type: http
      description: "A user's session of the platform app, the sign-in provider's short-lived JWT, sent by the app. Not for scripts: they take an API key."
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: "The request is not valid: `invalid_request`, `unknown_workflow`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      headers:
        request-id:
          $ref: "#/components/headers/RequestId"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
    Unauthorized:
      description: "No valid API key or session: `authentication_required`, `invalid_api_key`, `key_expired`, `invalid_session`, `session_expired`."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
