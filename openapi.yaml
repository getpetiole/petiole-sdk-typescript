    RateLimitLimit:
      description: "How many requests the caller may make in a minute, all at once if it likes: with an API key, the key's limit or its organisation's, whichever is nearer used up; with a user's session, the organisation's."
      schema:
        type: integer
    RateLimitRemaining:
      description: How many it may make now. It refills evenly over the minute.
      schema:
        type: integer
    RateLimitReset:
      description: Seconds until it may make `RateLimit-Limit` requests again.
      schema:
        type: integer
    RetryAfter:
