      required:
        - index
        - count
        - name
      title: Step
      description: 'The progress counter: "step 4 of 11".'
    Upload:
      properties:
        id:
          type: string
          pattern: ^upl_[0-7][0-9A-HJKMNP-TV-Z]{25}$
          description: "The upload's id: `upl_` and a ULID."
          examples:
            - upl_01JQ8ZC5T4V7B9K2MNPQRSTWXZ
        object:
          type: string
          const: upload
          default: upload
        url:
          type: string
          format: uri
          description: The signed URL to PUT the image to.
        headers:
          additionalProperties:
            type: string
          type: object
          description: The headers the PUT sends, exactly as given.
        expiresAt:
          type: string
          format: date-time
          description: When the URL stops taking the PUT.
      type: object
      required:
        - id
        - object
        - url
        - headers
        - expiresAt
      title: Upload
      description: |-
        An upload: a signed URL to PUT one image to. The image is kept for a
        day, and any number of analyses can be made of it in that time.
    Usage:
      properties:
        object:
          type: string
          const: usage
          default: usage
        from:
          type: string
          format: date
          description: The first day, in UTC.
          examples:
            - 2026-10-10
        to:
          type: string
          format: date
          description: The last day, in UTC.
          examples:
            - 2026-11-08
        days:
          items:
            $ref: "#/components/schemas/UsageDay"
          type: array
      type: object
      required:
        - object
        - from
        - to
        - days
      title: Usage
      description: |-
        The API key's analyses that ended in a range of days, by day,
        workflow and outcome.
    UsageDay:
      properties:
        date:
          type: string
          format: date
          description: The day, in UTC.
          examples:
            - 2026-11-08
        workflow:
          type: string
          examples:
            - leaf_area_v1
        succeeded:
          type: integer
          examples:
            - 42
        cancelled:
          type: integer
          examples:
            - 3
        failed:
          type: integer
          examples:
            - 0
      type: object
      required:
        - date
        - workflow
        - succeeded
        - cancelled
        - failed
      title: UsageDay
      description: The analyses of one workflow that ended on one day, by outcome.
    Workflow:
      properties:
        id:
          type: string
          description: The workflow's id, which names its version.
          examples:
            - leaf_area_v1
        object:
          type: string
          const: workflow
          default: workflow
        name:
          type: string
          description: The workflow's name.
          examples:
            - Leaf area
        description:
          type: string
          description: What the workflow measures.
        inputs:
          $ref: "#/components/schemas/WorkflowInputs"
        objectTypes:
          items:
            type: string
          type: array
          description: The object types its results hold.
          examples:
            - - leaf
        algorithmVersion:
          type: string
          description: The version of the measurement it runs now.
          examples:
            - 1.0.0
