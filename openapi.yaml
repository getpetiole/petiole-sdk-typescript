openapi: 3.1.0
info:
  title: Sauron API
  summary: "Measure plants in photos: leaf area and more, by workflow."
  description: |
    Runs an image through a workflow, a measurement such as leaf area, and returns the objects it measured, with their units and outlines.

    An analysis is asynchronous. Send the image, through an upload or in the request, with `POST /v1/analyses`; follow it with `GET /v1/analyses/{id}`, or receive its webhook; then read `GET /v1/analyses/{id}/result`. A photo the workflow cannot measure, such as one without the calibration pad, ends `cancelled` with a `code` that says why: a result to handle, not an error.

    Conventions:

    - Authenticate with an API key, `Authorization: Bearer ptl_live_…`.
    - Every id is a prefix and a ULID (`ana_`, `upl_`, `key_`, `whd_`, `org_`, `user_`), so ids sort by when they were made.
    - Every list is `{ "object": "list", "data": [...], "hasMore": … }`, paged with `limit` and `startingAfter`.
    - Every error is `application/problem+json` with a `code` and the `requestId`.
    - Every response carries `request-id`; a response to a request with a key or a user's session carries `RateLimit-Limit`, `RateLimit-Remaining` and `RateLimit-Reset`.
    - Every `POST` of `/v1` takes an `Idempotency-Key`.
    - A `traceparent` header (W3C Trace Context) is taken, and puts the request in the trace.
    - Names are camelCase; times are RFC 3339 in UTC.
  contact:
    name: Petiole
    url: https://docs.petiole.pro/
  version: "1"
servers:
  - url: https://api.petiole.pro
    description: Production
  - url: https://api-staging.petiole.pro
    description: Staging, with `ptl_test_` keys
paths:
  /v1/uploads:
    post:
      tags:
        - Uploads
      summary: Create an upload
      description: |-
        Makes a signed URL to PUT one image to, with the content type and the
        size given here. PUT the image to `url` with `headers`, then make
        analyses of it with `POST /v1/analyses`. The image is kept for a day.
        An upload suits large images and mobile clients; a small image can go in
        `POST /v1/analyses` itself.

        The type must be one a workflow the key may use takes, and the size no
        larger than the largest of theirs; `POST /v1/analyses` checks the image
        against its own workflow.
      operationId: createUpload
      security:
        - apiKey: []
        - user: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 255
          description: "Makes the request safe to retry: for 24 hours the same key returns what the first request made, and with a different request is refused with `idempotency_key_mismatch`. A UUID per request does."
        - name: Petiole-Organisation
          in: header
          required: false
          schema:
            examples:
              - org_01JQ8ZC5T4V7B9K2MNPQRSTWXZ
            type: string
          description: With a user's session, which of their organisations the request acts for; by default their one organisation that is not Personal, else their Personal one. A key acts for its own and ignores it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUpload"
      responses:
        "201":
          description: The upload, with the URL to PUT the image to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upload"
          headers:
            request-id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestEntityTooLarge"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/analyses:
    post:
      tags:
        - Analyses
      summary: Create an analysis
      description: |-
        Runs an image through a workflow. As JSON, the image is an upload's
        (`POST /v1/uploads`), and one upload can be analysed any number of times
        and under several workflows. As `multipart/form-data`, the image is in
        the request, for small images.

        The analysis is asynchronous: the response says it was accepted, and
        `links` where to follow it. Its events go to `webhookUrl`, or to the
        organisation's webhook endpoint.

        The image's type is told by its first bytes, and must be one the
        workflow takes, no larger than its limit (`GET /v1/workflows`). An image
        of the right type that does not decode is not refused here: its
        analysis ends `cancelled` with `invalid_image`.

        The daily quota counts the analyses that ended today, UTC, as
        `GET /v1/usage` does: the key's own limit when it has one, and the
        organisation's; past it, `429 quota_exceeded` with `Retry-After` at the
        next midnight UTC. The organisation's analyses that have not ended are
        capped too: past it, `429 concurrency_limit_exceeded`. A repeat with an
        `Idempotency-Key` answers what the first did and is counted once.
      operationId: createAnalysis
      security:
        - apiKey: []
        - user: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 255
          description: "Makes the request safe to retry: for 24 hours the same key returns what the first request made, and with a different request is refused with `idempotency_key_mismatch`. A UUID per request does."
        - name: Petiole-Organisation
          in: header
          required: false
          schema:
            examples:
              - org_01JQ8ZC5T4V7B9K2MNPQRSTWXZ
            type: string
          description: With a user's session, which of their organisations the request acts for; by default their one organisation that is not Personal, else their Personal one. A key acts for its own and ignores it.
      responses:
        "202":
          description: The analysis was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisCreated"
          headers:
            request-id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestEntityTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnalysis"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreateAnalysisForm"
    get:
      tags:
        - Analyses
      summary: List analyses
      description: |-
        The analyses of the organisation, newest first, of the workflows the
        key may use. `from` and `to` are to the millisecond, and a time without
        a zone is UTC. An analysis is listed from when it is created; its
        status here may trail `GET /v1/analyses/{id}` by a moment.
      operationId: listAnalyses
      security:
        - apiKey: []
        - user: []
      parameters:
        - name: workflow
          in: query
          required: false
          schema:
            type: string
          description: Only this workflow's analyses.
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Status"
          description: Only analyses with this status.
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Only analyses created at or after this time.
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Only analyses created before this time.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 10
          description: How many to return, from 1 to 100.
        - name: startingAfter
          in: query
          required: false
          schema:
            type: string
            pattern: ^ana_[0-7][0-9A-HJKMNP-TV-Z]{25}$
          description: "The page after this analysis: the last id of the page before."
        - name: Petiole-Organisation
          in: header
          required: false
          schema:
            examples:
              - org_01JQ8ZC5T4V7B9K2MNPQRSTWXZ
            type: string
          description: With a user's session, which of their organisations the request acts for; by default their one organisation that is not Personal, else their Personal one. A key acts for its own and ignores it.
      responses:
        "200":
          description: A page of analyses.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisList"
          headers:
            request-id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/analyses/{id}:
    get:
      tags:
        - Analyses
      summary: Get an analysis
      description: |-
        An analysis's status: where it is, the step running, and how it
        ended; with its timeline, every status it has had, and once it has
        ended how long each step took. Another organisation's analysis is not
        found, nor one of a workflow the key may not use.
      operationId: getAnalysis
      security:
        - apiKey: []
        - user: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^ana_[0-7][0-9A-HJKMNP-TV-Z]{25}$
            examples:
              - ana_01JQ8ZC5T4V7B9K2MNPQRSTWXZ
          description: The analysis's id.
        - name: Petiole-Organisation
          in: header
          required: false
          schema:
            examples:
              - org_01JQ8ZC5T4V7B9K2MNPQRSTWXZ
            type: string
          description: With a user's session, which of their organisations the request acts for; by default their one organisation that is not Personal, else their Personal one. A key acts for its own and ignores it.
      responses:
        "200":
          description: The analysis.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisDetail"
          headers:
            request-id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags:
        - Analyses
      summary: Delete an analysis
      description: |-
        Deletes the analysis's image, its result and its status, once it has
        ended; after that it is not found, and is not listed. An analysis that
        has not ended, one that is queued or running, or a failed attempt about
        to be retried, is refused with `analysis_not_ended`. The upload it was
        made of, if any, expires on its own a day after it was made.
      operationId: deleteAnalysis
      security:
        - apiKey: []
        - user: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^ana_[0-7][0-9A-HJKMNP-TV-Z]{25}$
            examples:
              - ana_01JQ8ZC5T4V7B9K2MNPQRSTWXZ
          description: The analysis's id.
        - name: Petiole-Organisation
          in: header
          required: false
          schema:
            examples:
              - org_01JQ8ZC5T4V7B9K2MNPQRSTWXZ
            type: string
          description: With a user's session, which of their organisations the request acts for; by default their one organisation that is not Personal, else their Personal one. A key acts for its own and ignores it.
      responses:
        "202":
          description: The analysis is being deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletedAnalysis"
          headers:
            request-id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/analyses/{id}/result:
    get:
      tags:
        - Analyses
      summary: Get an analysis's result
      description: |-
        The outcome of an analysis that has ended, `200`: the manifest of a
        succeeded one, with signed URLs to its files valid for 15 minutes, or
        the code and reason of a cancelled or failed one. While it runs, `202`
        with its status; a failed attempt that is retried has not ended. Read
        the result when it is needed rather than on every poll: the URLs are
        made for each request. A result is kept 30 days, and is not found
        after that.
      operationId: getAnalysisResult
      security:
        - apiKey: []
        - user: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^ana_[0-7][0-9A-HJKMNP-TV-Z]{25}$
            examples:
              - ana_01JQ8ZC5T4V7B9K2MNPQRSTWXZ
          description: The analysis's id.
        - name: Petiole-Organisation
          in: header
          required: false
          schema:
            examples:
              - org_01JQ8ZC5T4V7B9K2MNPQRSTWXZ
            type: string
          description: With a user's session, which of their organisations the request acts for; by default their one organisation that is not Personal, else their Personal one. A key acts for its own and ignores it.
      responses:
        "200":
          description: "The analysis has ended: its outcome."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
          headers:
            request-id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "202":
          description: "The analysis has not ended: its status only."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
          headers:
            request-id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/workflows:
    get:
      tags:
        - Workflows
      summary: List workflows
      description: |-
        The workflows the API key may use: what each takes, the object types
        its results hold, and the version of its measurement. In order of id.
      operationId: listWorkflows
      security:
        - apiKey: []
        - user: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 10
          description: How many to return, from 1 to 100.
        - name: startingAfter
          in: query
          required: false
          schema:
            type: string
          description: "The page after this workflow: the last id of the page before."
        - name: Petiole-Organisation
          in: header
          required: false
          schema:
            examples:
              - org_01JQ8ZC5T4V7B9K2MNPQRSTWXZ
            type: string
          description: With a user's session, which of their organisations the request acts for; by default their one organisation that is not Personal, else their Personal one. A key acts for its own and ignores it.
      responses:
        "200":
          description: The workflows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowList"
          headers:
            request-id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/object-types:
    get:
      tags:
        - Object types
      summary: Get the object-types registry
      description: |-
        Every object type a result can hold, with its properties, their types
        and their units: what a result's `objects` mean. A result's
        `objectTypesRegistryVersion` is this registry's `version`.
      operationId: getObjectTypes
      security:
        - apiKey: []
        - user: []
      parameters:
        - name: Petiole-Organisation
          in: header
          required: false
          schema:
            examples:
              - org_01JQ8ZC5T4V7B9K2MNPQRSTWXZ
            type: string
          description: With a user's session, which of their organisations the request acts for; by default their one organisation that is not Personal, else their Personal one. A key acts for its own and ignores it.
      responses:
        "200":
          description: The registry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectTypesRegistry"
          headers:
            request-id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/models:
    get:
      tags:
        - Models
      summary: List models
      description: |-
        The models the workflows the API key may use run: what each finds,
        its task, and the weights it runs now. In order of id.
      operationId: listModels
      security:
        - apiKey: []
        - user: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            minimum: 1
            default: 10
          description: How many to return, from 1 to 100.
        - name: startingAfter
          in: query
          required: false
          schema:
            type: string
          description: "The page after this model: the last id of the page before."
        - name: Petiole-Organisation
          in: header
          required: false
          schema:
            examples:
              - org_01JQ8ZC5T4V7B9K2MNPQRSTWXZ
            type: string
          description: With a user's session, which of their organisations the request acts for; by default their one organisation that is not Personal, else their Personal one. A key acts for its own and ignores it.
      responses:
        "200":
          description: The models.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelList"
          headers:
            request-id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/models/{id}:
    get:
      tags:
        - Models
      summary: Get a model
      description: |-
        A model, with the workflows the API key may use that run it. A model
        none of them runs is not found.
      operationId: getModel
      security:
        - apiKey: []
        - user: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            maxLength: 100
            pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
            examples:
              - leaf-detector
          description: The model's id.
        - name: Petiole-Organisation
          in: header
          required: false
          schema:
            examples:
              - org_01JQ8ZC5T4V7B9K2MNPQRSTWXZ
            type: string
          description: With a user's session, which of their organisations the request acts for; by default their one organisation that is not Personal, else their Personal one. A key acts for its own and ignores it.
      responses:
        "200":
          description: The model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelDetail"
          headers:
            request-id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/models/{id}/predictions:
    post:
      tags:
        - Models
      summary: Make a prediction
      description: |-
        Runs one model over one image and answers what it found, in the
        request: labels, scores, boxes and, for a segmenter, outlines, in
        fractions of the image as it is shown upright. A model finds; it
        measures nothing: measurements are a workflow's analyses.

        As JSON, the image is an upload's (`POST /v1/uploads`); as
        `multipart/form-data`, it is in the request. JPEG or PNG, at most 20 MiB
        and 100 million pixels; it is turned upright and given to the model at
        most 25 million pixels. A model that outlines what it is given
        (`sam2-small`) takes `boxes`, such as a detector's.

        A model that is not running starts first, which takes up to a minute:
        past the request's time, `503 model_starting` with `Retry-After`, and
        the request can be sent again. `GET /v1/models/{id}/status` says whether
        it is running, and starts it. A model that runs only in its workflows is
        `409 model_not_callable`. The predictions of a day, UTC, are counted
        against the organisation's `predictionsPerDay`: past it, `429
        quota_exceeded`. A repeat with an `Idempotency-Key` answers what the
        first did and is counted once.
      operationId: createPrediction
      security:
        - apiKey: []
        - user: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            maxLength: 100
            pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
            examples:
              - leaf-detector
          description: The model's id.
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 255
          description: "Makes the request safe to retry: for 24 hours the same key returns what the first request made, and with a different request is refused with `idempotency_key_mismatch`. A UUID per request does."
        - name: Petiole-Organisation
          in: header
          required: false
          schema:
            examples:
              - org_01JQ8ZC5T4V7B9K2MNPQRSTWXZ
            type: string
          description: With a user's session, which of their organisations the request acts for; by default their one organisation that is not Personal, else their Personal one. A key acts for its own and ignores it.
      responses:
        "200":
          description: What the model found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prediction"
          headers:
            request-id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/RequestEntityTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrediction"
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CreatePredictionForm"
  /v1/models/{id}/status:
    get:
      tags:
        - Models
      summary: Get a model's status
      description: |-
        Whether the model can answer a prediction now: `ready`; `starting`,
        waking from idle, which takes up to a minute; or `unavailable`. Asking
        starts a model that is not running, so a client can ask as it shows the
        model, and the model is awake by the time a photo is chosen. A model
        that runs only in its workflows is `unavailable` here.
      operationId: getModelStatus
      security:
        - apiKey: []
        - user: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            maxLength: 100
            pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
            examples:
              - leaf-detector
          description: The model's id.
        - name: Petiole-Organisation
          in: header
          required: false
          schema:
            examples:
              - org_01JQ8ZC5T4V7B9K2MNPQRSTWXZ
            type: string
          description: With a user's session, which of their organisations the request acts for; by default their one organisation that is not Personal, else their Personal one. A key acts for its own and ignores it.
      responses:
        "200":
          description: Whether the model can answer now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelStatus"
          headers:
            request-id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/usage:
    get:
      tags:
        - Usage
      summary: Get usage
      description: |-
        The analyses that ended in a range of days, both included, by day,
        workflow and outcome: an API key's own, or, for a user of the platform
        app, the whole organisation's. Days and workflows with none are left
        out. The range is at most 92 days. The daily quota counts the same
        analyses.
      operationId: getUsage
      security:
        - apiKey: []
        - user: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
          description: The first day, in UTC; default 30 days before `to`.
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
          description: The last day, in UTC; default today.
        - name: Petiole-Organisation
          in: header
          required: false
          schema:
            examples:
              - org_01JQ8ZC5T4V7B9K2MNPQRSTWXZ
            type: string
          description: With a user's session, which of their organisations the request acts for; by default their one organisation that is not Personal, else their Personal one. A key acts for its own and ignores it.
      responses:
        "200":
          description: The usage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usage"
          headers:
            request-id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
webhooks:
  analysisEvent:
    post:
      tags:
        - Webhooks
      summary: An analysis's event
      description: |-
        Sent to the analysis's `webhookUrl`, or else the organisation's
        webhook endpoint, when the analysis ends, and when it starts if the
        organisation asked for that. An answer other than 2xx, or none, is
        retried with backoff for 24 hours, so the same event can arrive more
        than once: its `id` tells.
      operationId: analysisEvent
      parameters:
        - description: "`t=<unix seconds>,v1=<hex HMAC-SHA256 of the secret over t, a dot and the raw body>`. After a secret is rotated, one `v1=` per secret for 24 hours. Refuse a `t` more than five minutes old."
          required: true
          schema:
            type: string
            examples:
              - t=1760692351,v1=5257a869e7ecebeda32affa62cdca3fa51cad7e77a0e56ff536d0ce8e108d8bd
          name: X-Sauron-Signature
          in: header
        - description: The delivery's id, the event's `id`.
          required: true
          schema:
            type: string
          name: X-Sauron-Delivery
          in: header
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisEvent"
        required: true
      responses:
        "204":
          description: Any 2xx answer acknowledges the event.
components:
  schemas:
    Analysis:
      properties:
        id:
          type: string
          description: "The analysis's id: `ana_` and a ULID."
        object:
          type: string
          const: analysis
          default: analysis
        workflow:
          type: string
          description: The workflow the image runs through.
        apiKeyId:
          anyOf:
            - type: string
            - type: "null"
          description: The key that submitted the analysis, or null when a user of the platform app did.
        userId:
          anyOf:
            - type: string
            - type: "null"
          description: The platform app's user who submitted the analysis, or null when a key did.
        metadata:
          description: The `metadata` given at submission, as it was sent.
        status:
          $ref: "#/components/schemas/Status"
          description: "`created` and `queued` before the analysis starts, `started` and `running` while it runs, then `succeeded`; `cancelled`, a domain outcome such as a photo without the calibration pad, named by `code`; or `failed`, a technical failure."
        final:
          type: boolean
          description: Whether no status follows. A `failed` attempt that is retried is not final, so wait for the final status before treating an analysis as failed.
        step:
          anyOf:
            - $ref: "#/components/schemas/Step"
            - type: "null"
          description: The step running, on a terminal status the last that ran; null before the first.
        code:
          anyOf:
            - type: string
            - type: "null"
          description: "Why the analysis was cancelled or failed: a domain code of the workflow, such as `no_markers` or `invalid_image`, or a technical code, such as `model_unavailable`."
        reason:
          anyOf:
            - type: string
            - type: "null"
          description: What `code` says, in words.
        attempt:
          type: integer
          description: The attempt the status belongs to, from 1; 0 before the first.
        maxAttempts:
          anyOf:
            - type: integer
            - type: "null"
          description: How many attempts the analysis may take, or null when not known.
        fingerprint:
          type: string
          description: The version of the input the status belongs to; empty before it is queued.
        queuedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: When the analysis was queued.
        startedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: When its current attempt started.
        updatedAt:
          type: string
          format: date-time
          description: When the status last changed.
        finishedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: When the analysis reached a terminal status.
        result:
          anyOf:
            - $ref: "#/components/schemas/Result"
            - type: "null"
          description: Where the result of a succeeded analysis went; null otherwise.
      type: object
      required:
        - id
        - object
        - workflow
        - apiKeyId
        - userId
        - metadata
        - status
        - final
        - step
        - code
        - reason
        - attempt
        - maxAttempts
        - fingerprint
        - queuedAt
        - startedAt
        - updatedAt
        - finishedAt
        - result
      title: Analysis
      description: |-
        The public projection of the status document, in the API's words: the
        job is an analysis, the job id is its id, and the profile is the workflow
        (M14-T2). It leaves out what is the platform's own: the tenant and the
        consumer, the execution, the image digest and the retained files.

        The field descriptions are the API's documentation (openapi.yaml of
        services/sauron-api), written for its readers. The schema is the one the
        API serialises, so object, which has a default, is required in it.
    AnalysisCreated:
      properties:
        id:
          type: string
          pattern: ^ana_[0-7][0-9A-HJKMNP-TV-Z]{25}$
          description: "The analysis's id: `ana_` and a ULID."
          examples:
            - ana_01JQ8ZC5T4V7B9K2MNPQRSTWXZ
        object:
          type: string
          const: analysis
          default: analysis
        workflow:
          type: string
          description: The workflow the image runs through.
          examples:
            - leaf_area_v1
        status:
          $ref: "#/components/schemas/Status"
          description: The analysis's status when it was accepted.
        createdAt:
          type: string
          format: date-time
          description: When the analysis was accepted.
        links:
          $ref: "#/components/schemas/AnalysisLinks"
      type: object
      required:
        - id
        - object
        - workflow
        - status
        - createdAt
        - links
      title: AnalysisCreated
      description: |-
        An analysis that has been accepted. Follow it with `links.self`, or
        wait for its webhook, then read `links.result`.
    AnalysisDetail:
      properties:
        id:
          type: string
          description: "The analysis's id: `ana_` and a ULID."
        object:
          type: string
          const: analysis
          default: analysis
        workflow:
          type: string
          description: The workflow the image runs through.
        apiKeyId:
          anyOf:
            - type: string
            - type: "null"
          description: The key that submitted the analysis, or null when a user of the platform app did.
        userId:
          anyOf:
            - type: string
            - type: "null"
          description: The platform app's user who submitted the analysis, or null when a key did.
        metadata:
          description: The `metadata` given at submission, as it was sent.
        status:
          $ref: "#/components/schemas/Status"
          description: "`created` and `queued` before the analysis starts, `started` and `running` while it runs, then `succeeded`; `cancelled`, a domain outcome such as a photo without the calibration pad, named by `code`; or `failed`, a technical failure."
        final:
          type: boolean
          description: Whether no status follows. A `failed` attempt that is retried is not final, so wait for the final status before treating an analysis as failed.
        step:
          anyOf:
            - $ref: "#/components/schemas/Step"
            - type: "null"
          description: The step running, on a terminal status the last that ran; null before the first.
        code:
          anyOf:
            - type: string
            - type: "null"
          description: "Why the analysis was cancelled or failed: a domain code of the workflow, such as `no_markers` or `invalid_image`, or a technical code, such as `model_unavailable`."
        reason:
          anyOf:
            - type: string
            - type: "null"
          description: What `code` says, in words.
        attempt:
          type: integer
          description: The attempt the status belongs to, from 1; 0 before the first.
        maxAttempts:
          anyOf:
            - type: integer
            - type: "null"
          description: How many attempts the analysis may take, or null when not known.
        fingerprint:
          type: string
          description: The version of the input the status belongs to; empty before it is queued.
        queuedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: When the analysis was queued.
        startedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: When its current attempt started.
        updatedAt:
          type: string
          format: date-time
          description: When the status last changed.
        finishedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: When the analysis reached a terminal status.
        result:
          anyOf:
            - $ref: "#/components/schemas/Result"
            - type: "null"
          description: Where the result of a succeeded analysis went; null otherwise.
        transitions:
          anyOf:
            - items:
                $ref: "#/components/schemas/AnalysisTransition"
              type: array
            - type: "null"
          description: Every status it has had, oldest first; null for a moment after it is made, until the platform has recorded it.
        stepDurationsMs:
          anyOf:
            - additionalProperties:
                type: integer
              type: object
            - type: "null"
          description: Milliseconds per step of the attempt that ended it; null until it has ended.
      type: object
      required:
        - id
        - object
        - workflow
        - apiKeyId
        - userId
        - metadata
        - status
        - final
        - step
        - code
        - reason
        - attempt
        - maxAttempts
        - fingerprint
        - queuedAt
        - startedAt
        - updatedAt
        - finishedAt
        - result
        - transitions
        - stepDurationsMs
      title: AnalysisDetail
      description: |-
        An analysis with its timeline: every change of its status in order,
        and, once it has ended, how long each step of its last attempt took.
    AnalysisEvent:
      properties:
        id:
          type: string
          pattern: ^whd_[0-7][0-9A-HJKMNP-TV-Z]{25}$
          description: The delivery's id, also in `X-Sauron-Delivery`; the same on every retry.
          examples:
            - whd_01JQ8ZC5T4V7B9K2MNPQRSTWXZ
        type:
          $ref: "#/components/schemas/EventType"
        createdAt:
          type: string
          format: date-time
          description: When the event happened.
        data:
          $ref: "#/components/schemas/Analysis"
      type: object
      required:
        - id
        - type
        - createdAt
        - data
      title: AnalysisEvent
      description: |-
        An event of an analysis. Switch on `type`: a cancelled analysis is a
        domain outcome, a failed one a technical failure.
    AnalysisLinks:
      properties:
        self:
          type: string
          description: The analysis.
          examples:
            - /v1/analyses/ana_01JQ8ZC5T4V7B9K2MNPQRSTWXZ
        result:
          type: string
          description: Its result.
          examples:
            - /v1/analyses/ana_01JQ8ZC5T4V7B9K2MNPQRSTWXZ/result
      type: object
      required:
        - self
        - result
      title: AnalysisLinks
      description: Where to follow an analysis, as paths of the API.
    AnalysisList:
      properties:
        object:
          type: string
          const: list
          default: list
        data:
          items:
            $ref: "#/components/schemas/Analysis"
          type: array
        hasMore:
          type: boolean
          description: Whether more follow; ask for them with `startingAfter` the last id.
      type: object
      required:
        - object
        - data
        - hasMore
      title: AnalysisList
      description: A page of analyses, newest first.
    AnalysisResult:
      properties:
        id:
          type: string
          pattern: ^ana_[0-7][0-9A-HJKMNP-TV-Z]{25}$
          description: The analysis's id.
          examples:
            - ana_01JQ8ZC5T4V7B9K2MNPQRSTWXZ
        object:
          type: string
          const: analysis_result
          default: analysis_result
        status:
          $ref: "#/components/schemas/Status"
          description: The analysis's status; `succeeded`, `cancelled` or `failed` once it has ended.
        code:
          anyOf:
            - type: string
            - type: "null"
          description: Why the analysis was cancelled or failed.
          examples:
            - no_markers
        reason:
          anyOf:
            - type: string
            - type: "null"
          description: What `code` says, in words.
        result:
          anyOf:
            - $ref: "#/components/schemas/ResultManifest"
            - type: "null"
          description: The manifest of a succeeded analysis.
        artifacts:
          anyOf:
            - additionalProperties:
                $ref: "#/components/schemas/Artifact"
              type: object
            - type: "null"
          description: "The files the manifest names, by name, each behind a signed URL. A result is its manifest: a workflow whose objects are vector data, such as `leaf_area_v1`, names no file, and this is empty."
      type: object
      required:
        - id
        - object
        - status
        - code
        - reason
        - result
        - artifacts
      title: AnalysisResult
      description: |-
        An analysis's result. While the analysis runs, only its status; once
        it has ended, its outcome: the manifest of a succeeded analysis with its
        files, or the code and reason of a cancelled or failed one. A cancelled
        analysis is a domain outcome, such as a photo without the calibration
        pad, and a result to handle like any other.
    AnalysisTransition:
      properties:
        status:
          $ref: "#/components/schemas/Status"
        step:
          anyOf:
            - $ref: "#/components/schemas/Step"
            - type: "null"
          description: The step it was at; null before the first.
        attempt:
          type: integer
          description: The attempt, from 1; 0 before the first.
        code:
          anyOf:
            - type: string
            - type: "null"
          description: The code of a cancelled or failed status; null otherwise.
        updatedAt:
          type: string
          format: date-time
          description: When the status changed.
      type: object
      required:
        - status
        - step
        - attempt
        - code
        - updatedAt
      title: AnalysisTransition
      description: One change of an analysis's status, as the platform recorded it.
    Artifact:
      properties:
        url:
          type: string
          format: uri
          description: A signed URL that reads the file.
        expiresAt:
          type: string
          format: date-time
          description: When the URL stops working, 15 minutes after it was made.
      type: object
      required:
        - url
        - expiresAt
      title: Artifact
      description: A file of the result, behind a signed URL.
    Box:
      properties:
        x:
          type: number
          maximum: 1
          minimum: 0
          description: Its left edge.
          examples:
            - 0.12
        y:
          type: number
          maximum: 1
          minimum: 0
          description: Its top edge.
          examples:
            - 0.3
        width:
          type: number
          maximum: 1
          minimum: 0
          description: Its width.
          examples:
            - 0.2
        height:
          type: number
          maximum: 1
          minimum: 0
          description: Its height.
          examples:
            - 0.18
      additionalProperties: false
      type: object
      required:
        - x
        - y
        - width
        - height
      title: Box
      description: |-
        A box, in fractions, 0 to 1, of the image's width and height as it
        is shown upright, as a result's `bbox` is.
    CreateAnalysis:
      additionalProperties: false
      description: An analysis to make of an upload.
      properties:
        uploadId:
          description: The upload whose image to analyse; its PUT must have finished.
          examples:
            - upl_01JQ8ZC5T4V7B9K2MNPQRSTWXZ
          pattern: ^upl_[0-7][0-9A-HJKMNP-TV-Z]{25}$
          type: string
        workflow:
          description: "The workflow to run the image through: one of `GET /v1/workflows`."
          examples:
            - leaf_area_v1
          maxLength: 64
          minLength: 1
          type: string
        webhookUrl:
          anyOf:
            - maxLength: 2048
              pattern: ^https://
              type: string
            - type: "null"
          default: null
          description: Where to POST the analysis's events, in place of the organisation's webhook endpoint. `https` only, and it must resolve to a public address.
          format: uri
        metadata:
          anyOf:
            - additionalProperties: {}
              type: object
            - type: "null"
          default: null
          description: Anything to keep with the analysis, up to 4096 bytes as JSON; returned as it was sent and never read.
      required:
        - uploadId
        - workflow
      title: CreateAnalysis
      type: object
    CreateAnalysisForm:
      additionalProperties: false
      description: |-
        An analysis to make of an image sent in the request, for small
        images; larger ones go through an upload.
      properties:
        image:
          description: The image, in a type and size the workflow takes.
          format: binary
          type: string
        workflow:
          description: "The workflow to run the image through: one of `GET /v1/workflows`."
          examples:
            - leaf_area_v1
          maxLength: 64
          minLength: 1
          type: string
        webhookUrl:
          anyOf:
            - maxLength: 2048
              pattern: ^https://
              type: string
            - type: "null"
          default: null
          description: Where to POST the analysis's events, in place of the organisation's webhook endpoint. `https` only, and it must resolve to a public address.
          format: uri
        metadata:
          anyOf:
            - type: string
            - type: "null"
          default: null
          description: A JSON object as text. Anything to keep with the analysis, up to 4096 bytes as JSON; returned as it was sent and never read.
      required:
        - image
        - workflow
      title: CreateAnalysisForm
      type: object
    CreatePrediction:
      additionalProperties: false
      description: A prediction on an upload's image.
      properties:
        confThreshold:
          anyOf:
            - exclusiveMaximum: 1
              exclusiveMinimum: 0
              type: number
            - type: "null"
          default: null
          description: A detector's or a segmenter's least score to report; the model's own by default.
          examples:
            - 0.25
        maxDetections:
          anyOf:
            - maximum: 300
              minimum: 1
              type: integer
            - type: "null"
          default: null
          description: At most this many detections, the highest scores first; 300 by default.
          examples:
            - 100
        boxes:
          anyOf:
            - items:
                $ref: "#/components/schemas/Box"
              maxItems: 50
              minItems: 1
              type: array
            - type: "null"
          default: null
          description: "For a model that outlines what it is given (`sam2-small`): the boxes to outline, such as a detector's. Required by such a model, refused by any other."
        uploadId:
          description: The upload whose image to predict on; its PUT must have finished.
          examples:
