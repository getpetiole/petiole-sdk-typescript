          items:
            type: string
          type: array
          description: The image types it takes.
          examples:
            - - image/jpeg
              - image/png
              - image/heic
        maxSizeBytes:
          type: integer
          description: The largest image it takes, in bytes.
          examples:
            - 20971520
        requiresCalibrationPad:
          type: boolean
