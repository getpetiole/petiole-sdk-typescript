  - name: Workflows
    description: "What an image can be run through: the measurements of the catalog."
  - name: Object types
    description: What a result's objects hold.
  - name: Models
    description: "The models the workflows run: what each finds, and the weights it runs now. A model finds; a workflow measures."
  - name: Usage
    description: The analyses an API key has run.
  - name: Webhooks
    description: The events the API sends to an organisation's endpoint.
