      title: PredictionModel
      description: The model a prediction ran, and the weights.
    Problem:
      description: |-
        An error, as problem details (RFC 9457). `code` says which, and stays
        the same when the wording of `title` and `detail` changes; `requestId` is
        the request's, also in its `request-id` header.
      properties:
        type:
          description: "A URI naming the problem: the documentation of its code."
          examples:
            - https://docs.petiole.pro/errors/not_found
          format: uri
          type: string
        title:
          description: What the code means, in words.
          type: string
        status:
          description: The response's HTTP status.
          examples:
            - 404
          type: integer
        detail:
          description: What went wrong with this request.
          type: string
        code:
          description: "The error, one of a set that grows: a client that meets a code it does not know goes by the status."
          examples:
            - not_found
          type: string
          x-extensible-enum:
            - invalid_request
            - unknown_workflow
            - authentication_required
            - invalid_api_key
            - key_expired
            - invalid_session
            - session_expired
            - workflow_not_allowed
            - organisation_suspended
            - not_a_member
            - user_required
            - owner_required
            - not_found
            - method_not_allowed
            - upload_incomplete
            - analysis_not_ended
            - model_not_callable
            - idempotency_key_mismatch
            - idempotency_key_in_use
            - image_too_large
            - unsupported_media_type
            - image_type_not_allowed
            - rate_limited
            - quota_exceeded
            - concurrency_limit_exceeded
            - internal_error
            - not_implemented
            - service_unavailable
            - model_starting
        requestId:
          description: The request's id.
          examples:
            - req_01JQ8ZC5T4V7B9K2MNPQRSTWXZ
          type: string
        errors:
          description: "With `invalid_request`: every reason the request is not valid."
          items:
            $ref: "#/components/schemas/ProblemError"
          type: array
      required:
        - type
        - title
        - status
        - code
        - requestId
      title: Problem
      type: object
    ProblemError:
      description: One reason a request is not valid.
      properties:
        detail:
          description: What is wrong.
          type: string
        pointer:
          description: Where in the JSON body, as a JSON Pointer (RFC 6901); absent for a parameter.
          type: string
        parameter:
          description: The query, path or header parameter; absent for the body.
          type: string
      required:
        - detail
      title: ProblemError
      type: object
    PropertyDefinition:
      properties:
        label:
          type: string
          examples:
            - Area
        type:
          type: string
          description: "The value's type: `number`, `integer`, `percentage`, `boolean`, `string`, the geometry types `geometry_bbox`, `geometry_polygon` and `geometry_multipolygon`, or the media types `media_image` and `media_mask`."
          examples:
            - number
        unit:
          type: string
          description: The value's unit, such as `cm2`, `cm` or `ratio`.
          examples:
            - cm2
        min:
          type: number
          description: The smallest value.
        max:
          type: number
          description: The largest value.
        required:
          type: boolean
          description: Whether every object has the property.
        nullable:
          type: boolean
          description: Whether the value may be null.
        allowEmpty:
          type: boolean
          description: Whether a string may be empty.
        allowedValues:
          items: {}
          type: array
          description: The values a string may take.
        valueShape:
          type: string
          description: The shape of a geometry value.
        allowedMimeTypes:
          items:
            type: string
          type: array
          description: The file types of a media value.
      type: object
      required:
        - label
        - type
      title: PropertyDefinition
      description: A property of an object type.
    Result:
      properties:
        sink:
          type: string
          description: "Where the result went: `bucket` for every analysis of the API."
        resultRequestId:
          anyOf:
            - type: string
            - type: "null"
          description: The `spruce` sink's request, and absent for any other sink.
        manifest:
          anyOf:
            - type: string
            - type: "null"
          description: The `bucket` sink's manifest. `GET /v1/analyses/{id}/result` returns it.
      type: object
      required:
        - sink
      title: Result
      description: "Where a succeeded job's result went: the sink and its own key only."
    ResultManifest:
      properties:
        payloadKind:
          type: string
          const: object_list
          default: object_list
        payloadVersion:
          type: integer
          description: The manifest's version; a breaking change makes a new one.
          examples:
            - 1
        jobId:
          type: string
          description: The analysis's id.
        processorKey:
          type: string
          description: The measurement that made the result.
          examples:
            - leaf_area
        algorithmVersion:
          type: string
          description: The version of the measurement.
          examples:
            - 1.0.0
        objectTypesRegistryVersion:
          type: integer
          description: The version of the object-types registry the objects follow.
          examples:
            - 1
        objects:
          items:
            $ref: "#/components/schemas/ResultObject"
          type: array
      type: object
      required:
        - payloadKind
        - payloadVersion
        - jobId
        - processorKey
        - algorithmVersion
        - objectTypesRegistryVersion
        - objects
      title: ResultManifest
      description: |-
        A result: the objects an analysis measured, in the object-types
        registry's terms (`GET /v1/object-types`).
    ResultObject:
      properties:
        objectType:
          type: string
          description: The object type, a key of the registry's `objectTypes`.
          examples:
            - leaf
        objectTypeVersion:
          type: integer
          description: The version of the object type the properties follow.
          examples:
            - 2
        objectId:
          type: string
          description: The object's id, unique within the result.
        properties:
          additionalProperties: {}
          type: object
          description: The object's properties, named and typed by its object type.
          examples:
            - area_cm2: 42.7
              confidence: 0.98
              perimeter_cm: 31.2
      type: object
      required:
        - objectType
        - objectTypeVersion
        - objectId
        - properties
      title: ResultObject
      description: |-
        One object the analysis measured. Its properties, their units and
        their shapes are those of `objectType` at `objectTypeVersion` in
        `GET /v1/object-types`. Geometry, a `bbox` and every point of a
        `polygon`, is in fractions, 0 to 1, of the width and height of the
        submitted image as it is shown with its EXIF orientation applied, as a
        browser shows it: draw the image at any size and scale each point to
        it.
    Status:
      type: string
      enum:
        - created
        - queued
        - started
        - running
        - succeeded
        - cancelled
        - failed
      title: Status
    Step:
