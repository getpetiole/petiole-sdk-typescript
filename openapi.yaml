        name:
          type: string
          description: The model's name.
          examples:
            - Leaf detector
        description:
          type: string
          description: What the model does.
          examples:
            - Finds each leaf in a photo of leaves laid on the calibration pad, as a box around it.
        source:
          type: string
          const: catalog
          description: "`catalog`, one of Petiole's; an organisation's own models come later."
          default: catalog
        family:
          type: string
          description: "What serves it and reads its output: `yolo`, `sam2`, `sam`, `dino` or `learn`."
          examples:
            - yolo
        task:
          type: string
          description: "What it does: `detect` (boxes), `segment` (outlines), `classify` or `embed` (features)."
          examples:
            - detect
        runtime:
          type: string
          description: "The weights' format: `pt` or `onnx`."
